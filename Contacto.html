<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacto | Clínica Integral Horizonte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&family=Young+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="site-header"></div>
<main class="wrap">
<div class="page-title"><h1>Contacto</h1><p>Escríbenos o visítanos.</p></div>
<section class="two">
  <div class="card"><form class="form" id="contactoForm">
    <div><label for="n">Nombre</label><input id="n" required></div>
    <div><label for="e">Correo</label><input id="e" type="email" required></div>
    <div class="full"><label for="t">Mensaje</label><textarea id="t" rows="5" required></textarea></div>
    <div class="full"><button class="btn" type="submit">Enviar mensaje</button></div>
  </form><div id="msg" class="msg hidden" role="status"></div></div>
  <div class="card"><h3>Datos de la clínica</h3><p>Una sola sede en México (ficticia).</p><p>Horario: lunes a sábado, 7:00 a 21:00.</p><p>Teléfono: 81 0000 0000 (ficticio)</p><p>Correo: contacto@clinica.local</p></div>
</section>
</main>
<div id="site-footer"></div>
<script src="js/layout.js"></script>
<script src="js/contacto.js"></script>
</body>
</html>
