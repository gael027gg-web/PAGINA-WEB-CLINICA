<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal del personal | Clínica Integral Horizonte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&family=Young+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="site-header"></div>
<main class="wrap">
<div class="page-title"><h1>Portal del personal</h1><p>Acceso para recepción y médicos. Demostración con datos ficticios.</p></div>
<section>
  <div class="card login" id="loginBox"><h3>Iniciar sesión</h3>
    <form id="loginForm" autocomplete="off"><label for="u">Usuario</label><input id="u" required>
    <label for="p" style="margin-top:10px">Contraseña</label><input id="p" type="password" required>
    <button class="btn" type="submit" style="margin-top:14px">Entrar</button></form>
    <div id="loginMsg" class="msg err hidden" role="alert"></div>
    <p style="font-size:.85rem;color:var(--muted)">Prueba: recepcion / Recep2026! o doctora / Medico2026!</p></div>
  <div class="card hidden" id="panel"><div class="row"><h3 id="quien" style="margin:0"></h3><button class="btn ghost" id="logout" style="margin:0">Cerrar sesión</button></div>
    <p id="info" style="color:var(--muted)"></p>
    <table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
</section>
</main>
<div id="site-footer"></div>
<script src="js/layout.js"></script>
<script src="js/portal.js"></script>
</body>
</html>
